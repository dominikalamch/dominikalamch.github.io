    <label class="ws-enc-label" for="ws-enc-pw">This page is protected. Enter the password to read it.</label>
    <div class="ws-enc-row">
      <input class="ws-enc-input" id="ws-enc-pw" type="password" autocomplete="current-password"
             spellcheck="false" placeholder="Password" />

<style>
  /* Uses the site's own tokens where they exist, with literal fallbacks so the
     gate still looks deliberate on a site that does not define them. The
     fallbacks come in both schemes, because the gate replaces the page body --
     and with it the site's theme script -- so nothing else here would react to
     a visitor who prefers dark. The script below also sets data-theme, which is
     what lets a site whose dark palette hangs off :root[data-theme='dark']
     supply its own colours in place of these. */
  /* The gate owns the whole canvas. Pass 2 empties the page component, and the
     site's :root token block goes with it, so --paper and --ink are undefined
     here and nothing else paints the page: without this the card would be dark
     on a white page for a visitor who prefers dark. color-scheme also makes the
     scrollbar and the password field's own chrome follow the theme. */
  :root { color-scheme: light dark; }
  :root[data-theme='light'] { color-scheme: light; }
  :root[data-theme='dark'] { color-scheme: dark; }
  .ws-enc {
    display: grid; place-items: center; padding: 1.5rem;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ws-enc-paper);
    color: var(--ws-enc-ink);
    --ws-enc-line: var(--line, #d8d8dd);
    --ws-enc-surface: var(--surface, #f6f6f8);
    --ws-enc-paper: var(--paper, #ffffff);
    --ws-enc-ink: var(--ink, #17171c);
    --ws-enc-ink-2: var(--ink-2, #55555f);
    --ws-enc-ink-3: var(--ink-3, #6d6d78);
    --ws-enc-accent: var(--accent, #3b5bdb);
    --ws-enc-accent-ink: var(--accent-ink, #ffffff);
    --ws-enc-danger: var(--accent-2, #c92a2a);
  }
  @media (prefers-color-scheme: dark) {
    .ws-enc {
      --ws-enc-line: var(--line, #34343c);
      --ws-enc-surface: var(--surface, #1c1c21);
      --ws-enc-paper: var(--paper, #121216);
      --ws-enc-ink: var(--ink, #f2f2f5);
      --ws-enc-ink-2: var(--ink-2, #b9b9c2);
      --ws-enc-ink-3: var(--ink-3, #9a9aa4);
      --ws-enc-accent: var(--accent, #7c93f0);
      --ws-enc-accent-ink: var(--accent-ink, #10121a);
      --ws-enc-danger: var(--accent-2, #ff8787);
    }
  }
  .ws-enc-form {
    width: 100%; max-width: 26rem; display: grid; gap: 0.75rem; padding: 1.5rem;
    border: 1px solid var(--ws-enc-line);
    border-radius: var(--radius-card, 12px);
    background: var(--ws-enc-surface);
    font-family: var(--font-body, system-ui, -apple-system, sans-serif);
  }
  .ws-enc-label { color: var(--ws-enc-ink-2); font-size: 0.95rem; line-height: 1.4; }
