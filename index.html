  <form class="ws-enc-form" autocomplete="off">
    <label class="ws-enc-label" for="ws-enc-pw">This page is protected. Enter the password to read it.</label>
    <div class="ws-enc-row">
      <input class="ws-enc-input" id="ws-enc-pw" type="password" autocomplete="current-password"
             spellcheck="false" placeholder="Password" />
      <button class="ws-enc-button" type="submit">Unlock</button>
    </div>
    <p class="ws-enc-status" role="status" aria-live="polite"></p>
  </form>
</div>
<style>
  /* Uses the site's own tokens where they exist, with literal fallbacks so the
     gate still looks deliberate on a site that does not define them. The
     fallbacks come in both schemes, because the gate replaces the page body --
     and with it the site's theme script -- so nothing else here would react to
     a visitor who prefers dark. The script below also sets data-theme, which is
     what lets a site whose dark palette hangs off :root[data-theme='dark']
     supply its own colours in place of these. */
  /* The gate owns the whole canvas. Pass 2 empties the page component, and the
     site's :root token block goes with it, so --paper and --ink are undefined
     here and nothing else paints the page: without this the card would be dark
     on a white page for a visitor who prefers dark. color-scheme also makes the
     scrollbar and the password field's own chrome follow the theme. */
  :root { color-scheme: light dark; }
  :root[data-theme='light'] { color-scheme: light; }
  :root[data-theme='dark'] { color-scheme: dark; }
  .ws-enc {
    display: grid; place-items: center; padding: 1.5rem;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ws-enc-paper);
    color: var(--ws-enc-ink);
    --ws-enc-line: var(--line, #d8d8dd);
    --ws-enc-surface: var(--surface, #f6f6f8);
    --ws-enc-paper: var(--paper, #ffffff);
    --ws-enc-ink: var(--ink, #17171c);
    --ws-enc-ink-2: var(--ink-2, #55555f);
    --ws-enc-ink-3: var(--ink-3, #6d6d78);
    --ws-enc-accent: var(--accent, #3b5bdb);
    --ws-enc-accent-ink: var(--accent-ink, #ffffff);
    --ws-enc-danger: var(--accent-2, #c92a2a);
  }
  @media (prefers-color-scheme: dark) {
    .ws-enc {
      --ws-enc-line: var(--line, #34343c);
      --ws-enc-surface: var(--surface, #1c1c21);
      --ws-enc-paper: var(--paper, #121216);
      --ws-enc-ink: var(--ink, #f2f2f5);
      --ws-enc-ink-2: var(--ink-2, #b9b9c2);
      --ws-enc-ink-3: var(--ink-3, #9a9aa4);
      --ws-enc-accent: var(--accent, #7c93f0);
      --ws-enc-accent-ink: var(--accent-ink, #10121a);
      --ws-enc-danger: var(--accent-2, #ff8787);
    }
  }
  .ws-enc-form {
    width: 100%; max-width: 26rem; display: grid; gap: 0.75rem; padding: 1.5rem;
    border: 1px solid var(--ws-enc-line);
    border-radius: var(--radius-card, 12px);
    background: var(--ws-enc-surface);
    font-family: var(--font-body, system-ui, -apple-system, sans-serif);
  }
  .ws-enc-label { color: var(--ws-enc-ink-2); font-size: 0.95rem; line-height: 1.4; }
  .ws-enc-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .ws-enc-input {
    flex: 1 1 12rem; min-width: 0; font: inherit; padding: 0.6rem 0.75rem;
    color: var(--ws-enc-ink); background: var(--ws-enc-paper);
    border: 1px solid var(--ws-enc-line); border-radius: var(--radius-card, 8px);
  }
  .ws-enc-button {
    font: inherit; cursor: pointer; padding: 0.6rem 1.1rem;
    color: var(--ws-enc-accent-ink); background: var(--ws-enc-accent);
    border: 1px solid transparent; border-radius: var(--radius-card, 8px);
  }
  .ws-enc-button[disabled] { opacity: 0.6; cursor: progress; }
  /* A remembered password unlocks without asking, so do not show the form at
     all while that is being tried -- it used to appear and vanish half a second
     later, which read as a glitch. */
  .ws-enc[data-ws-enc-checking] .ws-enc-label,
  .ws-enc[data-ws-enc-checking] .ws-enc-row { display: none; }
  .ws-enc-input:focus-visible, .ws-enc-button:focus-visible {
    outline: 2px solid var(--ws-enc-accent); outline-offset: 2px;
  }
  .ws-enc-status { margin: 0; min-height: 1.2em; font-size: 0.9rem; color: var(--ws-enc-ink-3); }
  .ws-enc-status[data-state="error"] { color: var(--ws-enc-danger); }
</style>
<script>
(function () {
  var root = document.getElementById("ws-enc");
  if (root === null) { return; }

  // The gate replaced the page body, and with it the site's theme script, so
  // decide the theme here the same way: an explicit earlier choice first, then
  // the OS preference. Styling only -- it must never block unlocking.
  try {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (error) { saved = null; }
    var prefersDark =
      typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute(
      "data-theme",
      saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light"
    );
  } catch (error) {
    /* ignore */
  }
  var form = root.querySelector(".ws-enc-form");
  var input = root.querySelector(".ws-enc-input");
  var button = root.querySelector(".ws-enc-button");
  var status = root.querySelector(".ws-enc-status");
  var payload = JSON.parse(document.getElementById("ws-enc-payload").textContent);

  var setStatus = function (message, state) {
    status.textContent = message;
    if (state === undefined) { status.removeAttribute("data-state"); }
    else { status.setAttribute("data-state", state); }
  };

  // crypto.subtle only exists in a secure context. https:// and file:// both
  // qualify; plain http:// to a host or IP does not. Say so plainly rather than
  // failing with "undefined is not an object".
  if (!globalThis.crypto || !globalThis.crypto.subtle) {
    setStatus(
      window.isSecureContext === false
        ? "This page needs a secure context to decrypt. Open it over https://, or directly from the file, rather than plain http://."
        : "This browser does not provide the Web Crypto API.",
      "error"
    );
    input.disabled = true;
    button.disabled = true;
    return;
  }

  var fromBase64 = function (value) {
    return Uint8Array.from(atob(value), function (c) { return c.charCodeAt(0); });
  };

  var toBase64 = function (buffer) {
    var bytes = new Uint8Array(buffer);
    var out = "";
    for (var i = 0; i < bytes.length; i += 1) { out += String.fromCharCode(bytes[i]); }
    return btoa(out);
  };

  // Cache the derived key against its salt. Deriving it is the slow part by
  // design, and the salt now identifies the password rather than the page, so
  // one cached key opens the whole site instantly. Equivalent in power to the
  // stored password sitting beside it, so it is no extra exposure.
  var KEY_KEY = "ws-enc:key:" + payload.salt;

  var readCachedKey = function () {
    try { return localStorage.getItem(KEY_KEY); } catch (error) { return null; }
  };

  // One unlock covers reloads and the site's other pages. A static export has
  // no server to hold a session, so the password itself is kept in
  // localStorage -- readable by any script on this origin, which is the trade
  // for not retyping it on every page. Only the password is stored and never
  // the derived key: re-deriving costs one PBKDF2 run and keeps a second
  // secret off disk.
  var STORE_KEY = "ws-enc:passwords";
  var MAX_REMEMBERED = 3;

  var readRemembered = function () {
    try {
      var list = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      if (Object.prototype.toString.call(list) !== "[object Array]") { return []; }
      return list
        .filter(function (value) { return typeof value === "string" && value !== ""; })
        .slice(0, MAX_REMEMBERED);
    } catch (error) {
      return [];
    }
  };

  var remember = function (password) {
    try {
      var list = readRemembered().filter(function (value) { return value !== password; });
      list.unshift(password);
      localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, MAX_REMEMBERED)));
    } catch (error) {
      /* private mode or blocked storage -- this unlock still worked */
    }
  };

  var usedKey = null;

  var rememberKey = function () {
    if (usedKey === null) { return Promise.resolve(true); }
    return crypto.subtle
      .exportKey("raw", usedKey)
      .then(function (raw) {
        try { localStorage.setItem(KEY_KEY, toBase64(raw)); } catch (error) { /* ignore */ }
        return true;
      })
      .catch(function () { return true; });
  };

  var unlockWith = function (keyPromise) {
    return keyPromise
      .then(function (key) {
        usedKey = key;
        return crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromBase64(payload.iv) },
          key,
          fromBase64(payload.ct)
        );
      })
      .then(function (plaintext) {
        var bundle = JSON.parse(new TextDecoder().decode(plaintext));
        var html = bundle.html;
        var assets = bundle.assets || {};

        // Assets travel inside the ciphertext, so there is nothing to fetch and
        // the page works from file:// too. Swap each original URL for a blob
        // URL: a string replace covers src, srcset, href and url() in one go.
        // Longest first, so one asset name cannot clobber a longer one that
        // happens to start with it.
        Object.keys(assets)
          .sort(function (a, b) { return b.length - a.length; })
          .forEach(function (url) {
            var asset = assets[url];
            var bytes = Uint8Array.from(atob(asset.b64), function (c) {
              return c.charCodeAt(0);
            });
            var blobUrl = URL.createObjectURL(
              new Blob([bytes], { type: asset.mime })
            );
            html = html.split(url).join(blobUrl);
          });

        var host = document.createElement("div");
        host.innerHTML = html;
        var nodes = Array.prototype.slice.call(host.childNodes);
        root.replaceWith.apply(root, nodes);

        // A script parsed out of innerHTML is inert -- it lands in the DOM and
        // never runs, even once moved into the document. On a normal page load
        // these scripts would have executed, so the page's own behaviour (the
        // theme toggle, any HTML embed) would silently stop working. Recreating
        // each one makes it run, which is what Webstudio's own HtmlEmbed does
        // for the same reason. They are replaced in document order, so inline
        // scripts still execute in the order the page author wrote them.
        var scripts = [];
        nodes.forEach(function (node) {
          if (node.nodeType !== 1) { return; }
          if (node.tagName === "SCRIPT") { scripts.push(node); }
          Array.prototype.push.apply(
            scripts,
            Array.prototype.slice.call(node.querySelectorAll("script"))
          );
        });
        scripts.forEach(function (old) {
          var fresh = document.createElement("script");
          for (var i = 0; i < old.attributes.length; i += 1) {
            fresh.setAttribute(old.attributes[i].name, old.attributes[i].value);
          }
          fresh.text = old.text;
          old.replaceWith(fresh);
        });
        return rememberKey();
      })
      .catch(function () {
        // AES-GCM is authenticated, so a failure here means the wrong password
        // rather than silently rendering garbage.
        return false;
      });
